# Nixpacks Configuration for Railway
[phases.setup]
nixPkgs = ["python312", "postgresql"]

[phases.install]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "cd backend && python manage.py collectstatic --noinput"
]

[start]
cmd = "bash start.sh"
